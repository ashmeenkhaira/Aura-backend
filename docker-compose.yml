services:
  db:
    image: postgres:16
    container_name: aura_postgres
    environment:
      POSTGRES_USER: aura_user
      POSTGRES_PASSWORD: aura_pass
      POSTGRES_DB: aura_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    container_name: aura_redis
    ports:
      - "6379:6379"

volumes:
  postgres_data:
